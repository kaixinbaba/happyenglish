name = "happyenglish"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
NODE_ENV = "production"
R2_PUBLIC_DOMAIN = "pub-46f834f249cf497c913e7fd87429cdc1.r2.dev"
LLM_MODEL = "anthropic/claude-sonnet-4"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "happyenglish-images"

# Secrets (set via `wrangler secret put`):
# DATABASE_URL
# OPENROUTER_API_KEY
# REPLICATE_API_TOKEN
# FEISHU_APP_ID
# FEISHU_APP_SECRET
# APP_URL
